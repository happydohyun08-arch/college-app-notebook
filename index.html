<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College App Manager</title>
<style>
:root {
  --bg:#ffffff; --bg-2:#f5f5f7; --fg:#1d1d1f; --muted:#6e6e73; --faint:#86868b; --line:#d2d2d7; --hair:#e8e8ed;
  --accent:#0071e3; --accent-hover:#0077ed; --link:#0066cc; --accent-ink:#ffffff;
  --reach:#c9341f; --target:#0071e3; --safety:#1d8a3a; --warn:#6e6e73;
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--fg);
  font:17px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Pretendard", "Segoe UI", "Malgun Gothic", sans-serif;
  letter-spacing:-0.022em; -webkit-font-smoothing:antialiased; }
a { color:var(--link); text-decoration:none; } a:hover { text-decoration:underline; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

/* 상단: Apple식 로컬 내비게이션 (제목 왼쪽, 메뉴 오른쪽) */
header { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter:saturate(1.8) blur(20px); -webkit-backdrop-filter:saturate(1.8) blur(20px); border-bottom:1px solid var(--hair); }
.bar { max-width:1024px; margin:0 auto; padding:0 22px; min-height:52px; display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
.brand { display:flex; align-items:center; gap:14px; cursor:pointer; }
.brand h1 { margin:0; font-size:21px; font-weight:600; letter-spacing:-0.02em; white-space:nowrap; }
.brand small { display:none; }
nav { display:flex; gap:22px; overflow-x:auto; margin-left:auto; scrollbar-width:none; }
nav::-webkit-scrollbar { display:none; }
nav button { flex:none; border:0; background:none; color:var(--fg); opacity:.8; padding:16px 0; font:inherit; font-size:12px; letter-spacing:-0.01em; cursor:pointer; }
nav button:hover { opacity:1; color:var(--link); }
nav button[aria-current="true"] { opacity:1; color:var(--faint); cursor:default; }
#langBtn { order:3; border:0; background:var(--accent); color:var(--accent-ink); border-radius:980px; padding:4px 11px; font:inherit; font-size:12px; cursor:pointer; }
.ribbon { background:var(--bg-2); text-align:center; font-size:14px; color:var(--fg); padding:12px 22px; }

main { max-width:1024px; margin:0 auto; padding:56px 22px 96px; }
/* 제목: Stripe식 두 톤 (굵은 제목 + 회색 이어지는 문장) */
section > h2 { font-size:40px; line-height:1.1; font-weight:600; letter-spacing:-0.028em; margin:0; }
section > .lead { font-size:21px; line-height:1.38; color:var(--muted); margin:8px 0 40px; max-width:720px; letter-spacing:-0.016em; }
section h3 { font-size:24px; font-weight:600; letter-spacing:-0.02em; margin:48px 0 16px; }
.card { padding:24px 0; border-top:1px solid var(--hair); margin:0; }
.card p:first-child { margin-top:0; } .card p:last-child { margin-bottom:0; }
.note { color:var(--muted); font-size:14px; margin:0 0 24px; padding:0 0 0 14px; border-left:2px solid var(--line); }
.muted { color:var(--muted); font-size:14px; }
.points { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:32px; margin:0 0 48px; }
.points .card { border:0; padding:0; }
.points h3 { margin:0 0 6px; font-size:19px; }
.points p { margin:0; color:var(--muted); font-size:15px; }

label { display:block; font-size:12px; color:var(--muted); margin:18px 0 6px; letter-spacing:0; }
input, select, textarea { width:100%; font:inherit; font-size:15px; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
  background:var(--bg); color:var(--fg); }
input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
textarea { min-height:96px; resize:vertical; line-height:1.55; }
.grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:0 16px; }

.btn { display:inline-flex; align-items:center; font:inherit; font-size:15px; padding:9px 20px; border-radius:980px; border:0;
  background:var(--accent); color:var(--accent-ink); cursor:pointer; white-space:nowrap; letter-spacing:-0.01em; }
.btn:hover { background:var(--accent-hover); }
.btn.ghost { background:none; color:var(--link); padding:9px 4px; border-radius:0; }
.btn.ghost:hover { background:none; text-decoration:underline; }
.btn:disabled { opacity:.35; cursor:default; text-decoration:none; }
.mini { font-size:13px; padding:4px 6px; }
.row { display:flex; flex-wrap:wrap; gap:16px; align-items:center; margin-top:20px; }

.toolbar { display:grid; grid-template-columns:2fr 1fr 1fr 1fr 1fr; gap:10px; margin:0 0 8px; }
@media (max-width:700px) { .toolbar { grid-template-columns:1fr 1fr; } .toolbar input { grid-column:1 / -1; } }
.myspec { display:grid; grid-template-columns:repeat(3, 1fr); gap:0 16px; background:var(--bg-2); border-radius:18px; padding:4px 20px 20px; }
.fitsum { display:flex; flex-wrap:wrap; gap:10px; margin:20px 0 24px; }
.fitsum button { font:inherit; font-size:15px; border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:980px; padding:8px 16px; cursor:pointer; font-variant-numeric:tabular-nums; }
.fitsum button b { margin-right:6px; }
.fitsum button[aria-pressed="true"] { border-color:var(--fg); background:var(--fg); color:var(--bg); }
.fitsum button[aria-pressed="true"] b { color:inherit; }
@media (max-width:700px) { .myspec { grid-template-columns:1fr 1fr 1fr; padding:4px 14px 16px; } }
.scroll { overflow-x:auto; padding:0; border:0; }
table { width:100%; border-collapse:collapse; font-size:14px; letter-spacing:-0.01em; }
thead th { color:var(--muted); font-size:12px; font-weight:400; text-align:left; padding:10px 12px 10px 0; border-bottom:1px solid var(--line); white-space:nowrap; }
td { padding:14px 12px 14px 0; border-bottom:1px solid var(--hair); vertical-align:top; }
td input, td select { min-width:120px; padding:6px 8px; font-size:14px; }
td .muted { font-size:12px; margin-top:2px; }
.num { font-variant-numeric:tabular-nums; white-space:nowrap; }
.tag { font-size:13px; font-weight:600; color:var(--fg); white-space:nowrap; font-variant-numeric:tabular-nums; }
.tag:empty { display:none; }
.tag.Reach { color:var(--reach); } .tag.Target { color:var(--target); } .tag.Safety { color:var(--safety); } .tag.Unknown { color:var(--faint); font-weight:400; }

.score { display:flex; align-items:baseline; gap:8px; }
.score b { font-size:48px; font-weight:600; letter-spacing:-0.03em; line-height:1; }
.crit { border-top:1px solid var(--hair); padding-top:16px; margin-top:16px; }
.meter { height:4px; border-radius:2px; background:var(--hair); overflow:hidden; margin:8px 0 10px; max-width:320px; }
.meter i { display:block; height:100%; background:var(--fg); }
blockquote { margin:10px 0; padding:0 0 0 14px; border-left:2px solid var(--line); color:var(--muted); }

.item { padding:20px 0; }
.item-head { display:flex; align-items:center; gap:12px; }
.item-head .num-badge { font-size:13px; color:var(--faint); font-variant-numeric:tabular-nums; width:20px; flex:none; }
.item-head b { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chips label { display:inline-flex; align-items:center; gap:6px; margin:0; padding:6px 14px; border:1px solid var(--line); border-radius:980px; font-size:14px; color:var(--fg); cursor:pointer; }
.chips label:has(input:checked) { border-color:var(--fg); background:var(--fg); color:var(--bg); }
.chips input { position:absolute; opacity:0; pointer-events:none; }
.counter { float:right; font-variant-numeric:tabular-nums; }

dialog { max-width:480px; width:calc(100% - 32px); border:0; border-radius:18px; padding:32px; background:var(--bg); color:var(--fg); box-shadow:0 30px 80px rgb(0 0 0 / .3); }
dialog h2 { margin:0 0 10px; font-size:28px; font-weight:600; letter-spacing:-0.025em; }
dialog p, dialog li { font-size:15px; color:var(--muted); }
dialog::backdrop { background:rgb(0 0 0 / .4); backdrop-filter:blur(6px); }
.check { display:flex; gap:10px; align-items:flex-start; font-size:15px; color:var(--fg); margin:12px 0; }
.check input { width:18px; height:18px; margin-top:2px; flex:none; accent-color:var(--accent); }
/* 시작 페이지 (가입 전) */
body.out main, body.out nav, body.out .ribbon, body:not(.out) #landing, body:not(.out) #headStart { display:none; }
#headStart { margin-left:auto; padding:4px 14px; font-size:12px; }
body.out #langBtn { order:2; }
body.out #headLogin { display:none; }
#headLogin { order:2; font-size:12px; }
.hero { text-align:center; padding:96px 22px 56px; max-width:980px; margin:0 auto; }
.eyebrow { font-size:17px; font-weight:600; color:var(--accent); margin:0 0 10px; letter-spacing:-0.01em; }
.hero h2 { font-size:64px; line-height:1.05; font-weight:700; letter-spacing:-0.035em; margin:0 auto; max-width:860px; }
.hero h2 span { color:var(--faint); }
.hero p.sub { font-size:24px; line-height:1.33; color:var(--muted); margin:20px auto 32px; max-width:680px; letter-spacing:-0.02em; }
.cta { display:flex; gap:28px; justify-content:center; align-items:center; flex-wrap:wrap; }
.cta .btn { font-size:17px; padding:12px 24px; }
.cta a::after { content:" ›"; }
.preview { max-width:760px; margin:0 auto 112px; padding:0 22px; }
.preview .frame { background:var(--bg-2); border-radius:28px; padding:40px; }
.preview .frame .tagline { font-size:12px; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; margin:0 0 14px; }
.band { max-width:1024px; margin:0 auto; padding:0 22px 112px; }
.band > h2 { font-size:48px; line-height:1.08; font-weight:700; letter-spacing:-0.03em; margin:0 0 12px; max-width:760px; }
.band > p.sub { font-size:21px; color:var(--muted); margin:0 0 40px; max-width:680px; }
.tiles { display:grid; grid-template-columns:repeat(2, 1fr); gap:20px; }
.tile { background:var(--bg-2); border-radius:24px; padding:36px; }
.tile .k { font-size:44px; font-weight:700; letter-spacing:-0.03em; line-height:1; margin:0 0 14px; font-variant-numeric:tabular-nums; }
.tile h3 { margin:0 0 6px; font-size:21px; font-weight:600; }
.tile p { margin:0; color:var(--muted); font-size:15px; }
.tile p.k { color:var(--fg); margin:0 0 14px; }
.steps { display:grid; grid-template-columns:repeat(3, 1fr); gap:32px; counter-reset:s; }
.steps div { border-top:1px solid var(--line); padding-top:20px; counter-increment:s; }
.steps div::before { content:counter(s, decimal-leading-zero); display:block; font-size:13px; color:var(--faint); margin-bottom:10px; font-variant-numeric:tabular-nums; }
.steps h3 { margin:0 0 6px; font-size:19px; } .steps p { margin:0; color:var(--muted); font-size:15px; }
.closing { text-align:center; background:var(--bg-2); padding:96px 22px; }
.closing h2 { font-size:48px; font-weight:700; letter-spacing:-0.03em; margin:0 0 24px; line-height:1.08; }
.terms { max-height:200px; overflow:auto; font-size:13px; color:var(--muted); background:var(--bg-2); border-radius:10px; padding:12px 14px; margin:6px 0 4px; }
.terms p { font-size:13px; margin:0 0 8px; }
details summary { cursor:pointer; color:var(--link); font-size:13px; margin-left:28px; }
.check.all { font-weight:600; border-bottom:1px solid var(--hair); padding-bottom:14px; }
.req { color:var(--accent); font-size:13px; }
@media (max-width:700px) { .hero { padding-top:56px; } .hero h2 { font-size:40px; } .hero p.sub { font-size:19px; }
  .band > h2, .closing h2 { font-size:32px; } .tiles, .steps { grid-template-columns:1fr; } .preview .frame, .tile { padding:24px; } }
footer { max-width:1024px; margin:0 auto; padding:20px 22px 40px; color:var(--faint); font-size:12px; border-top:1px solid var(--hair); }
@media (max-width:700px) { main { padding-top:36px; } section > h2 { font-size:32px; } section > .lead { font-size:19px; } nav { margin-left:0; width:100%; } }

/* ---------- 색 테마: 차분한 남색 + 인디고 한 가지 ---------- */
:root {
  --fg:#0f172a; --muted:#5b6478; --faint:#8a92a6; --line:#d9dde6; --hair:#eceef3; --bg-2:#f6f7f9;
  --accent:#4f46e5; --accent-hover:#4338ca; --link:#4338ca;
  --grad:linear-gradient(100deg, #4f46e5 0%, #2563eb 55%, #0891b2 100%);
  --tint:#f4f5fb; --glow:rgb(79 70 229 / .18);
}
.hero h2 span, .score b { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
.btn:not(.ghost) { background:var(--fg); color:var(--bg); box-shadow:0 1px 2px rgb(15 23 42 / .12); transition:background-color .15s, transform .15s; }
.btn:not(.ghost):hover { background:var(--accent); color:#fff; }
.btn:not(.ghost):disabled { box-shadow:none; }
#langBtn { background:none; color:var(--fg); border:1px solid var(--line); }
header { border-bottom:1px solid var(--hair); }
.brand h1 { color:var(--fg); font-weight:700; letter-spacing:-0.03em; }
nav button[aria-current="true"] { color:var(--fg); font-weight:600; }
.ribbon { background:var(--bg-2); color:var(--muted); font-size:13px; }
/* 시작 페이지: 위쪽에 옅은 인디고 빛 한 줄기 */
#landing { position:relative; overflow:hidden; }
#landing::before { content:""; position:absolute; left:50%; top:-320px; width:1100px; height:700px; transform:translateX(-50%); z-index:-1; pointer-events:none;
  background:radial-gradient(50% 50% at 50% 50%, rgb(79 70 229 / .16) 0%, rgb(37 99 235 / .06) 45%, transparent 70%); }
.eyebrow { color:var(--muted); font-size:14px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; }
.preview .frame { background:var(--bg); border:1px solid var(--hair); box-shadow:0 24px 60px -24px rgb(15 23 42 / .25); }
.tile { background:var(--bg); border:1px solid var(--hair); transition:border-color .2s, box-shadow .2s; }
.tile:hover { border-color:var(--line); box-shadow:0 12px 32px -18px rgb(15 23 42 / .25); }
.tile p.k { color:var(--accent); }
.steps div { border-top:1px solid var(--line); }
.steps div::before { color:var(--accent); font-weight:600; }
.closing { background:#0b1020; color:#fff; position:relative; overflow:hidden; }
.closing::before { content:""; position:absolute; inset:-40% 20% auto; height:120%; pointer-events:none; background:radial-gradient(50% 50% at 50% 50%, rgb(79 70 229 / .35), transparent 70%); }
.closing > * { position:relative; }
.closing h2, .hero h2 { margin-left:auto; margin-right:auto; } .closing h2 { color:#fff; } .closing .muted, .closing p { color:rgb(255 255 255 / .65); }
.closing .btn:not(.ghost) { background:#fff; color:#0b1020; }
.closing .btn:not(.ghost):hover { background:#e0e7ff; color:#0b1020; }
/* 앱 화면 */
.myspec { background:var(--bg-2); border:1px solid var(--hair); }
.fitsum button[aria-pressed="true"] { background:var(--fg); border-color:var(--fg); color:var(--bg); }
.meter i { background:var(--accent); }
.note { border-left-color:var(--accent); }
.chips label:has(input:checked) { background:var(--fg); border-color:var(--fg); color:var(--bg); }
input:focus, select:focus, textarea:focus { border-color:var(--accent); }

/* ---------- 다크 모드: 기기 설정을 따르고, 버튼으로 바꾸면 그 선택을 따른다 ---------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme:dark;
  --bg:#0a0d16; --bg-2:#111522; --fg:#e8eaf0; --muted:#9aa1b2; --faint:#6f7689; --line:#2a3042; --hair:#1b2030;
  --accent:#818cf8; --accent-hover:#a5b4fc; --link:#a5b4fc; --accent-ink:#0a0d16; --tint:#121729; --glow:rgb(129 140 248 / .25);
  --reach:#f87171; --target:#818cf8; --safety:#4ade80; --warn:#9aa1b2; }
}
:root[data-theme="dark"] { color-scheme:dark;
  --bg:#0a0d16; --bg-2:#111522; --fg:#e8eaf0; --muted:#9aa1b2; --faint:#6f7689; --line:#2a3042; --hair:#1b2030;
  --accent:#818cf8; --accent-hover:#a5b4fc; --link:#a5b4fc; --accent-ink:#0a0d16; --tint:#121729; --glow:rgb(129 140 248 / .25);
  --reach:#f87171; --target:#818cf8; --safety:#4ade80; --warn:#9aa1b2; }
#themeBtn { order:3; border:0; background:none; color:var(--fg); width:30px; height:30px; border-radius:50%; font-size:15px; line-height:1; cursor:pointer; }
#themeBtn:hover { background:var(--tint); }
body.out #themeBtn { order:2; }
body { transition:background-color .25s, color .25s; }

/* ---------- 다듬기 ---------- */
nav button[aria-current="true"] { box-shadow:inset 0 -2px 0 var(--accent); }
.tag.Reach, .tag.Target, .tag.Safety { padding:2px 10px; border-radius:980px; }
.tag.Reach { background:color-mix(in srgb, var(--reach) 13%, transparent); }
.tag.Target { background:color-mix(in srgb, var(--target) 13%, transparent); }
.tag.Safety { background:color-mix(in srgb, var(--safety) 13%, transparent); }
tbody tr { transition:background-color .15s; }
tbody tr:hover { background:var(--tint); }
input, select, textarea { border-radius:10px; transition:border-color .15s, box-shadow .15s; }
.item { border-radius:16px; transition:background-color .15s; }
section h3 { letter-spacing:-0.025em; }
dialog { border:1px solid color-mix(in srgb, var(--accent) 18%, transparent); }

/* ---------- 3D 모션 (움직임 줄이기 설정이면 끈다) ---------- */
@media (prefers-reduced-motion: no-preference) {
  .preview { perspective:1400px; }
  .preview .frame { transform:rotateX(calc(var(--rx, 0deg) + var(--tx, 0deg))) rotateY(var(--ty, 0deg)); transform-origin:50% 0;
    transition:transform .25s ease-out; will-change:transform; }
  .tile { transform:perspective(900px) rotateX(var(--tx, 0deg)) rotateY(var(--ty, 0deg)); transition:transform .2s ease-out, border-color .2s, box-shadow .2s; }
  .tile > * { transform:translateZ(0); }
  .reveal { opacity:0; translate:0 28px; transition:opacity .7s ease, translate .7s cubic-bezier(.2,.7,.2,1); }
  .reveal.in { opacity:1; translate:0 0; }
  .tile.reveal { transition:opacity .7s ease, translate .7s cubic-bezier(.2,.7,.2,1), transform .2s ease-out, border-color .2s, box-shadow .2s; }
  .hero h2 { animation:rise .9s cubic-bezier(.2,.7,.2,1) both; }
  .hero p.sub, .hero .cta { animation:rise .9s .12s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise { from { opacity:0; transform:perspective(800px) rotateX(24deg) translateY(30px); } }
}
</style>
</head>
<body>
<header>
 <div class="bar">
  <div class="brand" id="brand" role="link" tabindex="0"><h1 data-t="title"></h1><small data-t="tagline"></small></div>
  <nav id="tabs" aria-label="menu">
    <button data-tab="about" data-t="tab_about"></button>
    <button data-tab="profile" data-t="tab_profile"></button>
    <button data-tab="activities" data-t="tab_activities"></button>
    <button data-tab="schools" data-t="tab_schools"></button>
    <button data-tab="apps" data-t="tab_apps"></button>
    <button data-tab="essays" data-t="tab_essays"></button>
    <button data-tab="backup" data-t="tab_backup"></button>
  </nav>
  <button class="btn" id="headStart" data-signup data-t="land_cta"></button>
  <div id="headLogin"></div>
  <button id="themeBtn" type="button"></button>
  <button id="langBtn" data-t="lang_btn"></button>
 </div>
 <div class="ribbon" data-t="tagline_long"></div>
</header>
<div id="landing">
  <section class="hero">
    <p class="eyebrow" data-t="land_eyebrow"></p>
    <h2 data-t="land_h_html"></h2>
    <p class="sub" data-t="land_sub"></p>
    <div class="cta"><button class="btn" data-signup data-t="land_cta"></button><a href="#how" data-t="land_how_link"></a></div>
  </section>
  <div class="preview" aria-hidden="true"><div class="frame">
    <p class="tagline" data-t="land_demo"></p>
    <div class="score"><b>72</b><span class="muted">/ 100</span></div>
    <div class="crit"><b data-t="c_fit"></b> <span class="muted">16 / 20</span><div class="meter"><i style="width:80%"></i></div></div>
    <div class="crit"><b data-t="c_specific"></b> <span class="muted">17 / 20</span><div class="meter"><i style="width:85%"></i></div>
      <blockquote>"I timed myself, watched videos, and finally asked her to talk me through it."</blockquote></div>
    <div class="crit"><b data-t="c_reflect"></b> <span class="muted">12 / 20</span><div class="meter"><i style="width:60%"></i></div>
      <div class="muted" data-t="land_demo_fix"></div></div>
  </div></div>
  <section class="band">
    <h2 data-t="land_f_h"></h2><p class="sub" data-t="land_f_sub"></p>
    <div class="tiles">
      <div class="tile"><p class="k">5</p><h3 data-t="land_t1_h"></h3><p data-t="land_t1"></p></div>
